# CI (TECHSTACK.md §CI): make check + make test ở mọi push/PR. Đỏ thì chặn deploy —
# `make deploy` không tự chạy ở đây (cắt bản phát hành là việc chủ động của Authority).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bật pnpm qua corepack
        run: corepack enable

      - name: make check
        run: make check

      - name: make test
        run: make test
