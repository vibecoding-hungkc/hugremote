name: Optional macOS app

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'scripts/build_macos_app.mjs'
      - 'scripts/test_desktop_*'
      - 'package*.json'
      - '.github/workflows/macos-app.yml'

permissions:
  contents: read

jobs:
  macos-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Install and build web and backend
        run: |
          npm ci
          npm ci --prefix desktop
          npm run build
          npm run test:desktop
          npm run test:ui
      - name: Package optional macOS app
        run: node scripts/build_macos_app.mjs
      - name: Inspect app bundle and smoke bundled backend
        run: node scripts/smoke_macos_app.mjs
      - name: Launch Electron app and verify Vue renders
        run: node scripts/smoke_macos_gui.mjs
      - name: Verify DMG installer mounts and passes strict codesign
        shell: bash
        run: |
          set -euo pipefail
          dmg="dist/macos-app/HugRemote-macOS-${{ matrix.arch }}.dmg"
          test -f "$dmg"
          codesign --verify --verbose=2 "$dmg"
          mount_dir=$(mktemp -d /tmp/hugremote-dmg.XXXXXX)
          rmdir "$mount_dir"
          hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -readonly
          trap 'hdiutil detach "$mount_dir" -force || true' EXIT
          test -d "$mount_dir/HugRemote.app"
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = "/Applications"
          codesign --verify --deep --strict --verbose=2 "$mount_dir/HugRemote.app"
          runtime="$mount_dir/HugRemote.app/Contents/Resources/node/bin/node"
          payload="$mount_dir/HugRemote.app/Contents/Resources/hugremote"
          (cd "$payload" && "$runtime" -e "require('node-pty'); console.log('Mounted DMG node-pty loads')")
          hdiutil detach "$mount_dir"
          trap - EXIT
      - uses: actions/upload-artifact@v4
        with:
          name: HugRemote-macOS-${{ matrix.arch }}-dmg
          path: dist/macos-app/HugRemote-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
