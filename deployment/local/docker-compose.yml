# Máy thử cho dev/test/dogfood (TECHSTACK §2). App (api + web) chạy trên máy host — `make dev`.
# Khởi tạo khoá + ssh config mẫu: deployment/local/setup.sh (make dev tự gọi).
name: hugremote-local

x-sshd: &sshd
  build:
    context: .
    dockerfile: docker/sshd/Dockerfile
  image: hugremote/sshd:dev
  volumes:
    - ./ssh/dev_ed25519.pub:/seed/authorized_keys:ro
  environment:
    DEV_PASSWORD: dev-password-123

services:
  demo-sshd:
    <<: *sshd
    hostname: demo-sshd
    ports: ["127.0.0.1:2222:22"]
    networks: [edge]

  demo-jump:
    <<: *sshd
    hostname: demo-jump
    ports: ["127.0.0.1:2223:22"]
    networks: [edge, inner]

  # Chỉ tới được qua demo-jump (không mở cổng ra máy host)
  demo-behind:
    <<: *sshd
    hostname: demo-behind
    networks: [inner]

  # IdP thử cho SSO (AC-32/33/45): realm hugremote, client hugremote / hugremote-dev-secret,
  # người dùng an@nhom.vn và binh@ngoai.vn, mật khẩu matkhau-thu. Issuer: http://localhost:8180/realms/hugremote
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-123
      KC_HOSTNAME: http://localhost:8180
    volumes:
      - ./keycloak/hugremote-realm.json:/opt/keycloak/data/import/hugremote-realm.json:ro
    ports: ["127.0.0.1:8180:8180"]
    networks: [edge]

networks:
  edge: {}
  inner: { internal: true }
