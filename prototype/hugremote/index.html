<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HugRemote prototype</title>
<link rel="icon" href="data:,">
<style>
:root {
  --color-bg: #141414;
  --color-surface: #1c1c1c;
  --color-surface-raised: #262626;
  --color-divider: #2a2a2a;
  --color-border: #6b6b6b;
  --color-text: #ededed;
  --color-text-muted: #a3a3a3;
  --color-primary: #38bdf8;
  --color-on-primary: #0b1620;
  --color-danger: #f87171;
  --color-success: #34d399;
  --color-warning: #fbbf24;
  --color-accent-terminal: #c084fc;
  --color-accent-claude: #d97757;
  --color-scrim: #000000a6;

  --light-bg: #fafafa;
  --light-surface: #ffffff;
  --light-surface-raised: #f0f0f0;
  --light-divider: #e5e5e5;
  --light-border: #8a8a8a;
  --light-text: #171717;
  --light-text-muted: #525252;
  --light-primary: #0369a1;
  --light-on-primary: #ffffff;
  --light-danger: #b91c1c;
  --light-success: #047857;
  --light-warning: #a16207;
  --light-accent-terminal: #7e22ce;
  --light-accent-claude: #c2410c;

  --term-bg: #0f0f0f;
  --term-text: #ededed;
  --term-muted: #a3a3a3;
  --term-green: #34d399;
  --term-blue: #38bdf8;
  --term-yellow: #fbbf24;
  --term-red: #f87171;

  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-xl: 20px;

  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;
  --radius: 8px;
  --radius-pill: 999px;
  --shadow: 0 8px 24px #00000066;
  --tap: 44px;
  --sidebar-w: 280px;
  --bar-h: 36px;
  --bar-h-touch: 44px;
}
@media (max-width: 1023px) { :root { --bar-h: var(--bar-h-touch); } }
:root[data-theme="light"] {
  --color-bg: var(--light-bg);
  --color-surface: var(--light-surface);
  --color-surface-raised: var(--light-surface-raised);
  --color-divider: var(--light-divider);
  --color-border: var(--light-border);
  --color-text: var(--light-text);
  --color-text-muted: var(--light-text-muted);
  --color-primary: var(--light-primary);
  --color-on-primary: var(--light-on-primary);
  --color-danger: var(--light-danger);
  --color-success: var(--light-success);
  --color-warning: var(--light-warning);
  --color-accent-terminal: var(--light-accent-terminal);
  --color-accent-claude: var(--light-accent-claude);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); font-size: var(--text-base); line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--color-primary); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.mono { font-family: var(--font-mono); }
.muted { color: var(--color-text-muted); }
.xs { font-size: var(--text-xs); }
.sm { font-size: var(--text-sm); }
.grow { flex: 1; min-width: 0; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

/* ---------- vỏ (C15) ---------- */
.shell { height: 100dvh; display: grid; grid-template-columns: var(--sidebar-w) 1fr; }
.shell.noside { grid-template-columns: 1fr; }
.shell.noside .sidebar { display: none; }
.sidebar { background: var(--color-surface); border-right: 1px solid var(--color-divider); display: flex; flex-direction: column; min-height: 0; }
.side-head { height: var(--bar-h); display: flex; align-items: center; gap: var(--space-sm); padding: 0 var(--space-sm) 0 var(--space-lg); border-bottom: 1px solid var(--color-divider); font-weight: 600; }
.logo-dot { width: 10px; height: 10px; border-radius: var(--radius-pill); background: var(--color-primary); }
.search-btn { margin: var(--space-sm) var(--space-md) 0; display: flex; align-items: center; gap: var(--space-sm); min-height: var(--tap); padding: 0 var(--space-md); border-radius: var(--radius); border: 1px solid var(--color-divider); background: var(--color-bg); color: var(--color-text-muted); cursor: pointer; font-size: var(--text-sm); }
.search-btn kbd, kbd { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-muted); }
.search-btn kbd { margin-left: auto; }
.tree-head { display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-md) var(--space-sm) var(--space-xs) var(--space-lg); font-size: var(--text-xs); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .04em; }
.tree { flex: 1; overflow: auto; padding-bottom: var(--space-sm); }
.side-foot { border-top: 1px solid var(--color-divider); padding: var(--space-sm); display: grid; gap: var(--space-xs); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { height: var(--bar-h); flex: none; display: flex; align-items: center; gap: var(--space-sm); padding: 0 var(--space-sm) 0 var(--space-sm); border-bottom: 1px solid var(--color-divider); background: var(--color-bg); }
.ptabs { display: flex; gap: var(--space-xs); }
.ptab { display: flex; align-items: center; gap: var(--space-xs); padding: 0 var(--space-md); min-height: 28px; border-radius: var(--radius); border: 0; background: transparent; color: var(--color-text-muted); cursor: pointer; font-size: var(--text-sm); }
.ptab.on { background: var(--color-surface-raised); color: var(--color-text); }
.cnt { font-size: var(--text-xs); min-width: 18px; padding: 0 var(--space-xs); border-radius: var(--radius-pill); background: var(--color-warning); color: var(--color-bg); text-align: center; }
.ptabs-m { display: none; }
.content { flex: 1; overflow: auto; padding: var(--space-xl); min-height: 0; }
.content.flush { padding: 0; display: flex; flex-direction: column; }
.bottombar { display: none; }
.section-title { font-size: var(--text-xs); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .04em; margin: var(--space-xl) 0 var(--space-sm); }
.section-title:first-child { margin-top: 0; }
.wrap { max-width: 880px; margin: 0 auto; }
.crumb { display: flex; align-items: center; gap: var(--space-xs); min-width: 0; white-space: nowrap; overflow: hidden; font-size: var(--text-sm); }
.crumb b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.crumb .sep { color: var(--color-text-muted); }

/* C1 nút */
.btn { min-height: var(--tap); padding: 0 var(--space-lg); border-radius: var(--radius); border: 1px solid var(--color-border); background: var(--color-surface-raised); color: var(--color-text); display: inline-flex; align-items: center; justify-content: center; gap: var(--space-sm); cursor: pointer; font-size: var(--text-sm); font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--color-text-muted); }
.btn.primary { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); }
.btn.danger { background: var(--color-danger); color: var(--color-bg); border-color: var(--color-danger); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--color-surface-raised); }
.btn.sm { min-height: 32px; padding: 0 var(--space-md); }
.btn.icon { width: var(--tap); padding: 0; }
.btn.sm.icon { width: 32px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.on-primary { color: var(--color-primary); }
.btn.on-danger { color: var(--color-danger); }
.btn .num { font-size: var(--text-xs); }
.btns { display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: center; }

/* C2 */
.field { display: grid; gap: var(--space-xs); margin-bottom: var(--space-lg); align-content: start; }
.field label { font-size: var(--text-sm); color: var(--color-text-muted); }
.input { min-height: var(--tap); width: 100%; padding: 0 var(--space-md); border-radius: var(--radius); border: 1px solid var(--color-border); background: var(--color-surface-raised); font-size: var(--text-base); }
textarea.input { padding: var(--space-sm) var(--space-md); resize: none; }
.input.err { border-color: var(--color-danger); }
.field .msg { font-size: var(--text-xs); color: var(--color-danger); }
.field .hint { font-size: var(--text-xs); color: var(--color-text-muted); }
.otp { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--space-sm); }
.otp .input { text-align: center; font-family: var(--font-mono); font-size: var(--text-xl); padding: 0; }
.seg { display: flex; gap: var(--space-xs); background: var(--color-surface-raised); padding: var(--space-xs); border-radius: var(--radius); }
.seg button { flex: 1; min-height: 36px; border: 0; background: transparent; border-radius: var(--radius); cursor: pointer; font-size: var(--text-sm); color: var(--color-text-muted); display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); white-space: nowrap; padding: 0 var(--space-sm); }
.seg button.on { background: var(--color-bg); color: var(--color-text); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); align-items: start; }
.chk { display: flex; gap: var(--space-sm); align-items: flex-start; font-size: var(--text-sm); }
.chk input { width: 18px; height: 18px; margin-top: 2px; }

/* C3 */
.list { background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: var(--radius); overflow: hidden; }
.row { display: flex; align-items: center; gap: var(--space-md); min-height: 52px; padding: var(--space-sm) var(--space-lg); border-bottom: 1px solid var(--color-divider); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:hover, .row.sel { background: var(--color-surface-raised); }
.row .t { flex: 1; min-width: 0; }
.row .t1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t2 { font-size: var(--text-sm); color: var(--color-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skel { background: var(--color-surface-raised); border-radius: var(--radius); height: 14px; }
.skel-row { display: flex; gap: var(--space-md); align-items: center; min-height: 52px; padding: var(--space-sm) var(--space-lg); border-bottom: 1px solid var(--color-divider); }

/* C4 C5 */
.empty { text-align: center; padding: var(--space-xl); max-width: 460px; margin: var(--space-xl) auto; display: grid; gap: var(--space-lg); justify-items: center; }
.empty p { margin: 0; color: var(--color-text-muted); }
.empty .big { width: 32px; height: 32px; }
.error { border: 1px solid var(--color-danger); border-radius: var(--radius); padding: var(--space-lg); display: grid; gap: var(--space-sm); background: var(--color-surface); }
.error .h { color: var(--color-danger); font-weight: 600; }
.error p { margin: 0; color: var(--color-text-muted); font-size: var(--text-sm); }
.warnbox { border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--color-warning); padding: var(--space-md) var(--space-lg); display: flex; gap: var(--space-md); align-items: center; flex-wrap: wrap; background: var(--color-surface); margin-bottom: var(--space-lg); font-size: var(--text-sm); }

/* C11 cây */
.node { display: flex; align-items: center; gap: var(--space-sm); min-height: 36px; padding: 0 var(--space-xs) 0 var(--space-md); cursor: pointer; font-size: var(--text-sm); }
.node.l1 { padding-left: var(--space-xl); }
.node.l2 { padding-left: calc(var(--space-xl) + var(--space-lg)); }
.node:hover { background: var(--color-surface-raised); }
.node.sel { background: var(--color-surface-raised); box-shadow: inset 2px 0 0 var(--color-primary); }
.node .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .meta { font-size: var(--text-xs); color: var(--color-text-muted); white-space: nowrap; }
.node .meta.warn { color: var(--color-warning); }
.node .act { opacity: 0; }
.node:hover .act, .node:focus-within .act, .node.sel .act { opacity: 1; }
.node.host { font-weight: 600; }
.node.err .nm { color: var(--color-danger); }
.node.ign .nm { color: var(--color-text-muted); }
.chev { transition: transform .15s; }
.chev.open { transform: rotate(90deg); }
.term-ic { color: var(--color-accent-terminal); }
.claude-ic { color: var(--color-accent-claude); }
.git-ic { color: var(--color-primary); }
.warn-ic { color: var(--color-warning); }

/* C14 */
.dot { width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--color-text-muted); flex: none; }
.dot.ok { background: var(--color-success); }
.dot.run { background: var(--color-primary); animation: pulse 1.6s ease-in-out infinite; }
.dot.warn { background: var(--color-warning); }
.dot.err { background: var(--color-danger); }
@keyframes pulse { 50% { opacity: .35; } }
.badge { display: inline-flex; align-items: center; gap: var(--space-xs); padding: 2px var(--space-sm); border-radius: var(--radius-pill); background: var(--color-surface-raised); font-size: var(--text-xs); color: var(--color-text-muted); white-space: nowrap; flex: none; }
.badge.warn { background: var(--color-surface); color: var(--color-warning); box-shadow: inset 0 0 0 1px var(--color-warning); }
.badge.danger { background: var(--color-surface); color: var(--color-danger); box-shadow: inset 0 0 0 1px var(--color-danger); }

/* C13 */
.conn { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-sm) var(--space-lg); background: var(--color-surface-raised); border-bottom: 1px solid var(--color-warning); font-size: var(--text-sm); flex: none; }

/* C8 + C32 thanh phiên, chia ô */
.tabbar { height: var(--bar-h); flex: none; display: flex; align-items: stretch; background: var(--color-surface); border-bottom: 1px solid var(--color-divider); }
.tabs { flex: 1; min-width: 0; display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: thin; }
.tab { display: flex; align-items: center; gap: var(--space-sm); padding: 0 var(--space-xs) 0 var(--space-md); border-right: 1px solid var(--color-divider); cursor: pointer; font-size: var(--text-sm); color: var(--color-text-muted); white-space: nowrap; flex: none; max-width: 240px; }
.tab .tn { overflow: hidden; text-overflow: ellipsis; }
.tab.on { color: var(--color-text); background: var(--color-bg); box-shadow: inset 0 2px 0 var(--color-primary); }
.tab.ended .tn { text-decoration: line-through; }
.tab .kbd { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-muted); }
.tabbar .tools { flex: none; display: flex; align-items: center; gap: var(--space-xs); padding: 0 var(--space-sm); border-left: 1px solid var(--color-divider); }
.sesspick { display: none; }
.panes { flex: 1; display: flex; min-height: 0; }
.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.pane-head { flex: none; display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-xs) var(--space-xs) var(--space-xs) var(--space-md); font-size: var(--text-xs); color: var(--color-text-muted); border-bottom: 1px solid var(--color-divider); background: var(--color-surface); }
.pane-head select { min-height: 32px; border-radius: var(--radius); border: 1px solid var(--color-divider); background: var(--color-bg); font-size: var(--text-xs); max-width: 240px; }
.splitter { width: 6px; cursor: col-resize; background: var(--color-divider); flex: none; }
.splitter:hover, .splitter.drag { background: var(--color-primary); }

/* terminal */
.term { flex: 1; overflow: auto; margin: 0; padding: var(--space-md); background: var(--term-bg); font-family: var(--font-mono); font-size: var(--text-sm); line-height: 1.4; color: var(--term-text); white-space: pre; cursor: text; }
.term .g { color: var(--term-green); }
.term .b { color: var(--term-blue); }
.term .m { color: var(--term-muted); }
.term .y { color: var(--term-yellow); }
.term .r { color: var(--term-red); }
.term .cur { background: var(--term-text); color: var(--term-bg); }
.ended-cover { display: grid; place-items: center; gap: var(--space-md); padding: var(--space-xl); color: var(--term-muted); text-align: center; background: var(--term-bg); }

/* C10 */
.keybar { display: none; flex: none; background: var(--color-surface); border-top: 1px solid var(--color-divider); padding: var(--space-xs); }
.keys { display: flex; gap: var(--space-xs); overflow-x: auto; }
.key { min-width: var(--tap); height: var(--tap); padding: 0 var(--space-sm); border-radius: var(--radius); border: 1px solid var(--color-divider); background: var(--color-surface-raised); font-family: var(--font-mono); font-variant-ligatures: none; font-size: var(--text-sm); cursor: pointer; flex: none; }
.key.on { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); }
.drawer { display: grid; gap: var(--space-sm); padding: var(--space-sm) var(--space-xs) var(--space-xs); }
.drawer .grp { font-size: var(--text-xs); color: var(--color-text-muted); }
.drawer .keys { flex-wrap: wrap; }

/* C6 C9 C23 C27 */
.scrim { position: fixed; inset: 0; background: var(--color-scrim); z-index: 40; display: flex; }
.sheet { margin-left: auto; width: 420px; max-width: 100%; height: 100%; background: var(--color-surface); box-shadow: var(--shadow); display: flex; flex-direction: column; }
.sheet.wide { width: max(420px, 50vw); }
.sheet-head { height: var(--bar-h); flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-sm) 0 var(--space-lg); border-bottom: 1px solid var(--color-divider); font-weight: 600; }
.sheet-body { flex: 1; overflow: auto; padding: var(--space-lg); }
.sheet-foot { padding: var(--space-md) var(--space-lg); border-top: 1px solid var(--color-divider); display: flex; gap: var(--space-sm); justify-content: flex-end; flex-wrap: wrap; }
.dialog { margin: auto; width: 480px; max-width: calc(100% - 2 * var(--space-lg)); max-height: calc(100% - 2 * var(--space-lg)); overflow: auto; background: var(--color-surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--space-xl); display: grid; gap: var(--space-lg); }
.dialog.warn { box-shadow: var(--shadow), inset 0 0 0 1px var(--color-danger); }
.dialog h2 { margin: 0; font-size: var(--text-xl); }
.dialog p { margin: 0; color: var(--color-text-muted); font-size: var(--text-sm); }
.fp { font-family: var(--font-mono); font-size: var(--text-sm); background: var(--color-bg); border-radius: var(--radius); padding: var(--space-md); word-break: break-all; }
.fp.old { text-decoration: line-through; color: var(--color-text-muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: var(--space-xs) var(--space-lg); font-size: var(--text-sm); margin: 0; }
.kv dt { color: var(--color-text-muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.menu { position: fixed; z-index: 50; min-width: 260px; max-width: calc(100vw - 2 * var(--space-lg)); max-height: 70vh; overflow: auto; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--space-xs); }
.menu.inline { position: absolute; bottom: 100%; margin-bottom: var(--space-xs); left: 0; }
.menu .grp { padding: var(--space-xs) var(--space-md); font-size: var(--text-xs); color: var(--color-text-muted); }
.mi { min-height: 40px; padding: var(--space-xs) var(--space-md); border-radius: var(--radius); cursor: pointer; display: grid; gap: 2px; align-content: center; font-size: var(--text-sm); }
.mi:hover, .mi.on, .mi:focus-visible { background: var(--color-surface-raised); }
.mi .d { font-size: var(--text-xs); color: var(--color-text-muted); }
.mi.notif b .btn { flex: none; }
.mi.danger b, .mi.danger { color: var(--color-danger); }
.mi b { display: flex; align-items: center; gap: var(--space-sm); font-weight: 500; }
.mi b .grow + * { margin-left: auto; }
.toast { position: fixed; z-index: 70; left: 50%; bottom: var(--space-xl); transform: translateX(-50%); background: var(--color-surface-raised); color: var(--color-text); border: 1px solid var(--color-border); border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--space-sm) var(--space-lg); font-size: var(--text-sm); display: flex; align-items: center; gap: var(--space-sm); max-width: calc(100vw - 2 * var(--space-lg)); }
.keytbl { display: grid; grid-template-columns: auto 1fr; gap: var(--space-xs) var(--space-lg); font-size: var(--text-sm); }
.keytbl kbd { color: var(--color-text); background: var(--color-surface-raised); padding: 0 var(--space-xs); border-radius: var(--radius); white-space: nowrap; }

/* S1 */
.auth { height: 100dvh; display: grid; place-items: center; padding: var(--space-lg); overflow: auto; }
.auth-card { width: 100%; max-width: 380px; display: grid; gap: var(--space-lg); }
.auth-card h1 { margin: 0; font-size: var(--text-xl); }
.auth-card p { margin: 0; color: var(--color-text-muted); font-size: var(--text-sm); }
.or { display: flex; align-items: center; gap: var(--space-sm); color: var(--color-text-muted); font-size: var(--text-xs); }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--color-divider); }
.brand { display: flex; align-items: center; gap: var(--space-sm); font-weight: 600; }

/* S7 */
.card { background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: var(--radius); padding: var(--space-lg); display: grid; gap: var(--space-md); margin-bottom: var(--space-lg); }
.card h3 { margin: 0; font-size: var(--text-base); display: flex; align-items: center; gap: var(--space-sm); }
.card p { margin: 0; }
.qr { width: 148px; height: 148px; display: grid; grid-template-columns: repeat(21, 1fr); background: var(--color-text); padding: var(--space-sm); border-radius: var(--radius); }
.qr i { background: var(--color-text); }
.qr i.k { background: var(--color-bg); }
.codes { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-xs) var(--space-lg); font-family: var(--font-mono); font-size: var(--text-sm); background: var(--color-bg); padding: var(--space-md); border-radius: var(--radius); }
.check { display: flex; align-items: center; gap: var(--space-sm); font-size: var(--text-sm); }
.check .bad { color: var(--color-danger); }
.steps { display: grid; gap: var(--space-sm); }
.step { display: flex; align-items: center; gap: var(--space-sm); font-size: var(--text-sm); }
.prog { height: 6px; border-radius: var(--radius-pill); background: var(--color-surface-raised); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--color-primary); }
.prog.warn i { background: var(--color-warning); }
.start { box-shadow: inset 0 0 0 1px var(--color-primary); }
.start .n { width: 24px; height: 24px; border-radius: var(--radius-pill); display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--color-border); font-size: var(--text-xs); flex: none; }
.start .done .n { background: var(--color-success); box-shadow: none; color: var(--color-bg); }
.start .done .lbl { text-decoration: line-through; color: var(--color-text-muted); }
.start .cur .lbl { font-weight: 600; }
.overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-md); }
.subnav { display: flex; gap: var(--space-xs); margin-bottom: var(--space-lg); overflow-x: auto; }
.logv { font-family: var(--font-mono); font-size: var(--text-xs); background: var(--term-bg); color: var(--term-text); padding: var(--space-md); border-radius: var(--radius); max-height: 220px; overflow: auto; white-space: pre; margin: 0; }
.logv .r { color: var(--term-red); }
.logv .y { color: var(--term-yellow); }

/* S8 */
.files { display: grid; grid-template-columns: 280px 1fr; flex: 1; min-height: 0; }
.ftree { border-right: 1px solid var(--color-divider); overflow: auto; background: var(--color-surface); }
.ftool { display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-xs) var(--space-xs) var(--space-xs) var(--space-sm); border-bottom: 1px solid var(--color-divider); }
.fside { padding: var(--space-sm) var(--space-sm) 0; display: grid; gap: var(--space-sm); }
.fside .input { min-height: 36px; font-size: var(--text-sm); }
.editor { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.ehead { flex: none; display: flex; align-items: center; gap: var(--space-xs); padding: 0 var(--space-sm) 0 var(--space-md); height: var(--bar-h); border-bottom: 1px solid var(--color-divider); background: var(--color-surface); font-size: var(--text-sm); }
.ehead .fname { font-weight: 600; white-space: nowrap; }
.ehead .fdir { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-muted); direction: rtl; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; cursor: copy; }
.codewrap { flex: 1; overflow: auto; display: flex; align-items: flex-start; background: var(--color-bg); font-family: var(--font-mono); font-size: var(--text-sm); line-height: 1.55; font-variant-ligatures: none; }
.gutter { flex: none; padding: var(--space-md) 0; text-align: right; color: var(--color-text-muted); user-select: none; position: sticky; left: 0; background: var(--color-bg); }
.gutter div { padding: 0 var(--space-md) 0 var(--space-sm); min-width: 44px; }
.gutter .add { box-shadow: inset -3px 0 0 var(--color-success); }
.gutter .mod { box-shadow: inset -3px 0 0 var(--color-primary); }
.gutter .hl, .code .hl { background: var(--color-surface-raised); }
.code { flex: 1; margin: 0; padding: var(--space-md) var(--space-md) var(--space-md) 0; outline: none; white-space: pre; min-height: 100%; }
.code > div { min-height: 1.55em; }
.codewrap.wrapon .code { white-space: pre-wrap; word-break: break-all; }
.code .kw { color: var(--color-accent-terminal); }
.code .st { color: var(--color-success); }
.code .cm { color: var(--color-text-muted); }
.code mark, .sres mark { background: var(--color-warning); color: var(--color-bg); border-radius: 2px; }
.preview { flex: 1; overflow: auto; padding: var(--space-xl); max-width: 760px; }
.preview h1 { font-size: var(--text-xl); margin-top: 0; }
.preview code { font-family: var(--font-mono); font-size: var(--text-sm); background: var(--color-surface-raised); padding: 2px var(--space-xs); border-radius: var(--radius); }
.edkeys { display: none; }
.legend { padding: var(--space-xs) var(--space-md); font-size: var(--text-xs); color: var(--color-text-muted); }
.findbar { flex: none; display: flex; align-items: center; gap: var(--space-xs); flex-wrap: wrap; padding: var(--space-xs) var(--space-sm); border-bottom: 1px solid var(--color-divider); background: var(--color-surface); }
.findbar .input { min-height: 32px; width: 200px; font-size: var(--text-sm); }
.notice { flex: none; display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap; padding: var(--space-xs) var(--space-xs) var(--space-xs) var(--space-md); background: var(--color-surface-raised); box-shadow: inset 0 -1px 0 var(--color-primary); font-size: var(--text-sm); }
.notice.danger { box-shadow: inset 0 -1px 0 var(--color-danger); }
.cmp { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.cmp > div { overflow: auto; border-right: 1px solid var(--color-divider); display: flex; flex-direction: column; }
.cmp pre { margin: 0; padding: var(--space-md); font-family: var(--font-mono); font-size: var(--text-sm); line-height: 1.55; }
.cmp .x { background: var(--color-surface-raised); box-shadow: inset 3px 0 0 var(--color-warning); }
.sres { font-size: var(--text-sm); }
.sres .sf { display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-sm) var(--space-md) var(--space-xs); font-weight: 600; }
.sres .sl { display: flex; gap: var(--space-sm); padding: var(--space-xs) var(--space-md) var(--space-xs) var(--space-xl); font-family: var(--font-mono); font-size: var(--text-xs); cursor: pointer; white-space: nowrap; overflow: hidden; min-height: 32px; align-items: center; }
.sres .sl:hover { background: var(--color-surface-raised); }
.sres .sl .n { color: var(--color-text-muted); min-width: 28px; text-align: right; }
.special { flex: 1; display: grid; place-content: center; justify-items: center; gap: var(--space-md); padding: var(--space-xl); text-align: center; background: var(--color-bg); }
.imgbox { width: 220px; height: 220px; border-radius: var(--radius); background: var(--color-surface-raised); display: grid; place-items: center; color: var(--color-primary); }
.imgbox svg.i { width: 96px; height: 96px; stroke-width: 1; }
.linkp { background: none; border: 0; padding: 0; cursor: pointer; color: var(--color-primary); text-align: left; font: inherit; }
.linkp:hover { text-decoration: underline; }

/* S9 */
.git { display: grid; grid-template-columns: 340px 1fr; flex: 1; min-height: 0; }
.gleft { border-right: 1px solid var(--color-divider); overflow: auto; display: flex; flex-direction: column; background: var(--color-surface); }
.repolist { flex: none; max-height: calc(5.5 * 44px); overflow-y: auto; border-bottom: 1px solid var(--color-divider); }
.gsec { display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-sm) var(--space-xs) var(--space-xs) var(--space-md); font-size: var(--text-xs); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .04em; }
.grow-row { display: flex; align-items: center; gap: var(--space-sm); min-height: 44px; padding: 0 var(--space-xs) 0 var(--space-md); cursor: pointer; border-bottom: 1px solid var(--color-divider); }
.grow-row:hover, .grow-row.sel { background: var(--color-surface-raised); }
.grow-row .act { opacity: 0; }
.grow-row:hover .act, .grow-row.sel .act, .grow-row:focus-within .act { opacity: 1; }
.add { color: var(--color-success); }
.del { color: var(--color-danger); }
.diff { flex: 1; overflow: auto; margin: 0; font-family: var(--font-mono); font-size: var(--text-sm); line-height: 1.55; background: var(--color-bg); }
.diff div { padding: 0 var(--space-md); white-space: pre; }
.diff .a { color: var(--color-success); background: var(--color-surface); }
.diff .d { color: var(--color-danger); background: var(--color-surface); }
.diff .h { color: var(--color-text-muted); }
.commitbox { padding: var(--space-md); border-top: 1px solid var(--color-divider); display: grid; gap: var(--space-sm); margin-top: auto; position: sticky; bottom: 0; background: var(--color-surface); }

/* S10 */
.chat { flex: 1; overflow: auto; padding: var(--space-lg) var(--space-xl); background: var(--color-bg); }
.col { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-lg); }
.msg { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-sm); overflow-wrap: anywhere; }
.msg.user { justify-self: end; max-width: 85%; background: var(--color-surface-raised); padding: var(--space-md) var(--space-lg); border-radius: var(--radius); }
.md { display: grid; gap: var(--space-sm); line-height: 1.6; }
.md > * { margin: 0; }
.md h1, .md h2, .md h3 { font-size: var(--text-base); font-weight: 600; margin-top: var(--space-sm); }
.md ul, .md ol { padding-left: var(--space-xl); display: grid; gap: var(--space-xs); }
.md code { font-family: var(--font-mono); font-size: var(--text-sm); background: var(--color-surface-raised); padding: 0 var(--space-xs); border-radius: var(--radius); }
.md pre { background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: var(--radius); padding: var(--space-md); overflow-x: auto; }
.md pre code { background: transparent; padding: 0; }
.md blockquote { border-left: 3px solid var(--color-divider); padding-left: var(--space-md); color: var(--color-text-muted); }
.md .tbl { overflow-x: auto; }
.md table { border-collapse: collapse; font-size: var(--text-sm); min-width: 100%; }
.md th, .md td { border: 1px solid var(--color-divider); padding: var(--space-xs) var(--space-sm); text-align: left; vertical-align: top; }
.md th { background: var(--color-surface-raised); font-weight: 600; }
.md tr:nth-child(even) td { background: var(--color-surface); }
.msg.queued { opacity: .7; box-shadow: inset 0 0 0 1px var(--color-divider); background: transparent; }
.who { font-size: var(--text-xs); font-weight: 600; color: var(--color-accent-claude); display: flex; align-items: center; gap: var(--space-xs); }
.think { font-size: var(--text-sm); color: var(--color-text-muted); box-shadow: inset 2px 0 0 var(--color-divider); padding-left: var(--space-md); }
.tool { border: 1px solid var(--color-divider); border-radius: var(--radius); background: var(--color-surface); font-size: var(--text-sm); }
.tool .th { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-sm) var(--space-md); }
.tool .tb { padding: var(--space-sm) var(--space-md); border-top: 1px solid var(--color-divider); font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-muted); white-space: pre-wrap; }
.ask { border-radius: var(--radius); background: var(--color-surface); box-shadow: inset 0 0 0 1px var(--color-warning); padding: var(--space-lg); display: grid; gap: var(--space-md); }
.ask .h { display: flex; align-items: center; gap: var(--space-sm); font-weight: 600; color: var(--color-warning); }
.note { font-size: var(--text-sm); color: var(--color-text-muted); display: flex; align-items: center; gap: var(--space-sm); }
.summary { border-radius: var(--radius); background: var(--color-surface); border: 1px solid var(--color-divider); padding: var(--space-md); display: grid; gap: var(--space-sm); font-size: var(--text-sm); }
.summary .stats { display: flex; gap: var(--space-md); flex-wrap: wrap; color: var(--color-text-muted); font-size: var(--text-xs); }
.summary .files { display: flex; gap: var(--space-xs); flex-wrap: wrap; }
.askbar { display: none; }
.caret { display: inline-block; width: 8px; height: 1em; background: var(--color-text); vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.composer { flex: none; background: transparent; padding: var(--space-sm) var(--space-md) var(--space-md); }
.composer .in { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-sm); }
.composer .bar { display: flex; align-items: center; gap: var(--space-xs); flex-wrap: wrap; position: relative; }
.cbox { border: 1px solid transparent; border-radius: var(--radius); background: linear-gradient(var(--color-bg), var(--color-bg)) padding-box, linear-gradient(120deg, var(--color-accent-claude), var(--color-primary), var(--color-accent-terminal)) border-box; padding: var(--space-xs) var(--space-xs) var(--space-xs) var(--space-sm); display: grid; gap: var(--space-xs); }
.cbox:focus-within { border-width: 2px; padding: calc(var(--space-xs) - 1px) calc(var(--space-xs) - 1px) calc(var(--space-xs) - 1px) calc(var(--space-sm) - 1px); }
.crow { display: flex; align-items: center; gap: var(--space-xs); position: relative; min-width: 0; }
.crow textarea { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; outline: none; padding: var(--space-sm) 0; font-size: var(--text-base); line-height: 1.4; max-height: 160px; }
.cbox > .crow:not(.tools) textarea { min-height: calc(1.5 * (1.4em + 2 * var(--space-sm))); }
.crow .chip { min-height: 28px; }
.cscroll { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--space-xs); overflow-x: auto; scrollbar-width: none; }
.cscroll .chip { flex: none; }
.composer .line { display: flex; align-items: flex-end; gap: var(--space-xs); }
.composer .line textarea { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 32px; padding: 0 var(--space-sm); border-radius: var(--radius); border: 1px solid var(--color-divider); background: var(--color-bg); font-size: var(--text-xs); cursor: pointer; color: var(--color-text-muted); }
.chip b { color: var(--color-text); font-weight: 500; }
.chip.warn { border-color: var(--color-warning); color: var(--color-warning); }
.chip.warn b { color: var(--color-warning); }
.chip.danger, .chip.danger b { border-color: var(--color-danger); color: var(--color-danger); }
.chip.on { border-color: var(--color-primary); color: var(--color-text); }
.danger-t { color: var(--color-danger); }
.input.sm { min-height: 28px; padding: 0 var(--space-sm); }
input.sw { appearance: none; width: 34px; height: 20px; border-radius: 10px; background: var(--color-divider); position: relative; cursor: pointer; flex: none; margin: 0; }
input.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--color-text); transition: left .15s; }
input.sw:checked { background: var(--color-primary); }
input.sw:checked::after { left: 16px; }
.attach { display: inline-flex; gap: var(--space-xs); align-items: center; font-size: var(--text-xs); padding: 2px var(--space-xs) 2px var(--space-sm); border-radius: var(--radius-pill); background: var(--color-surface-raised); }
.slash { border: 1px solid var(--color-divider); border-radius: var(--radius); background: var(--color-bg); padding: var(--space-xs); }
.slash .mi { display: flex; gap: var(--space-md); align-items: center; }
.slash .mi b { font-family: var(--font-mono); min-width: 90px; flex: none; white-space: nowrap; }
.slash .mi .muted { flex: 1; min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }

/* S11 S12 */
.spot { margin: 12vh auto auto; width: 620px; max-width: calc(100% - 2 * var(--space-lg)); background: var(--color-surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--color-border); overflow: hidden; align-self: flex-start; }
.spot .top { display: flex; align-items: center; border-bottom: 1px solid var(--color-divider); padding-right: var(--space-xs); }
.spot input { flex: 1; border: 0; background: transparent; padding: var(--space-lg); font-size: var(--text-base); outline: none; min-width: 0; }
.spot .res { max-height: 50vh; overflow: auto; padding: var(--space-xs); }
.spot .grp { padding: var(--space-sm) var(--space-md) var(--space-xs); font-size: var(--text-xs); color: var(--color-text-muted); }
.spot .hint { padding: var(--space-sm) var(--space-md); border-top: 1px solid var(--color-divider); font-size: var(--text-xs); color: var(--color-text-muted); }

/* bảng điều khiển prototype (không thuộc sản phẩm) */
.proto { position: fixed; left: var(--space-md); bottom: var(--space-md); z-index: 60; background: var(--color-surface-raised); border: 1px solid var(--color-border); border-radius: var(--radius); box-shadow: var(--shadow); font-size: var(--text-xs); max-width: 380px; }
.proto summary { cursor: pointer; padding: var(--space-sm) var(--space-md); color: var(--color-warning); font-weight: 600; }
.proto .pb { padding: 0 var(--space-md) var(--space-md); display: grid; gap: var(--space-sm); }
.proto .pb div { display: flex; flex-wrap: wrap; gap: var(--space-xs); align-items: center; }
.proto button { font-size: var(--text-xs); padding: 2px var(--space-sm); border-radius: var(--radius); border: 1px solid var(--color-divider); background: var(--color-bg); cursor: pointer; }
.proto button.on { border-color: var(--color-primary); color: var(--color-primary); }

/* trang mẫu component #/_ds (không thuộc sản phẩm) — chỉ bố cục, mọi kiểu component dùng lại class ở trên */
.ds-page { height: 100dvh; overflow: auto; padding: var(--space-xl); }
.ds-head { display: flex; align-items: center; gap: var(--space-md); flex-wrap: wrap; margin-bottom: var(--space-sm); }
.ds-head h1 { margin: 0; font-size: var(--text-xl); }
.ds-toc { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin: var(--space-lg) 0; }
.ds-sec { border-top: 1px solid var(--color-divider); padding: var(--space-xl) 0; }
.ds-sec > h2 { margin: 0 0 var(--space-xs); font-size: var(--text-xl); }
.ds-sec > p { margin: 0 0 var(--space-lg); color: var(--color-text-muted); font-size: var(--text-sm); }
.ds-sec > h3 { margin: var(--space-lg) 0 var(--space-sm); font-size: var(--text-base); }
.ds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: var(--space-lg); align-items: start; }
.ds-grid.wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); }
.ds-grid.one { grid-template-columns: minmax(0, 1fr); }
.ds-grid.sm {grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); }
.ds-cell { min-width: 0; display: grid; gap: var(--space-xs); align-content: start; }
.ds-box { min-width: 0; overflow: auto; border: 1px dashed var(--color-divider); border-radius: var(--radius); padding: var(--space-md); }
.ds-box.flush { padding: 0; }
.ds-stage { position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; border: 1px dashed var(--color-divider); border-radius: var(--radius); background: var(--color-bg); }
.ds-lbl { font-size: var(--text-xs); color: var(--color-text-muted); }
.ds-sw { display: flex; gap: var(--space-sm); align-items: center; font-size: var(--text-xs); min-width: 0; }
.ds-sw i { width: 40px; height: 40px; border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--color-border); flex: none; }
.ds-phone { max-width: 390px; }
/* khung điện thoại: chép đúng luật của @media (max-width: 767px) cho các khối chỉ có trên mobile */
.ds-phone { --bar-h: var(--bar-h-touch); }
.ds-phone .bottombar { display: grid; grid-template-columns: repeat(3, 1fr); height: calc(var(--bar-h) + 8px); background: var(--color-surface); border-top: 1px solid var(--color-divider); }
.ds-phone .bottombar button { border: 0; background: transparent; display: grid; place-items: center; gap: 2px; font-size: var(--text-xs); color: var(--color-text-muted); cursor: pointer; padding-top: var(--space-xs); }
.ds-phone .bottombar button.on { color: var(--color-primary); }
.ds-phone .keybar { display: block; }
.ds-phone .edkeys { display: flex; gap: var(--space-xs); overflow-x: auto; padding: var(--space-xs); border-top: 1px solid var(--color-divider); background: var(--color-surface); }
.ds-phone .tabbar .tabs, .ds-phone .ptabs-d { display: none; }
.ds-phone .sesspick { display: flex; flex: 1; min-width: 0; align-items: center; gap: var(--space-sm); padding: 0 var(--space-md); background: transparent; border: 0; cursor: pointer; font-size: var(--text-sm); }
.ds-phone .ptabs-m { display: flex; flex: none; justify-content: space-around; border-bottom: 1px solid var(--color-divider); background: var(--color-surface); padding: var(--space-xs); }
@media (max-width: 767px) { .ds-page { padding: var(--space-lg); } }

@media (max-width: 1023px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: var(--sidebar-w); transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  .shell.side-open .sidebar { transform: none; }
  .shell.noside .sidebar { display: flex; }

/* ================= S8 FILES ================= */

}

}

  if ((r.name === 'term' || r.name === 'web') && mod && k === 'w') { e.preventDefault(); return closeSession(r.host, r.proj, r.sid); }
